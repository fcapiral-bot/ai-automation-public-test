# ONE-SHOT PROBE (Test 4A). Lives only on a disposable claude/label-probe-* branch and is never merged.
# When its own PR is opened it adds the bridge label to that one PR with the Actions GITHUB_TOKEN, to
# show whether a label applied by github-actions[bot] starts the Claude Routine. No checkout, no PR
# code is run, no secrets, no pull_request_target, one API call.
name: label-probe

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  label:
    if: startsWith(github.head_ref, 'claude/label-probe-') && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Add the label once
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "pr=$PR sha=$SHA actor=$GITHUB_ACTOR"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=bridge:needs-fix'
